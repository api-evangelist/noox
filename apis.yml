aid: noox
name: Noox
description: 'Noox is a Web3 platform for creating and collecting achievement badges as soulbound
  NFTs, letting people build verifiable on-chain reputation. Users discover community-curated
  Web3 achievements, check eligibility, and mint them as identity-bound (non-transferable) NFTs,
  while creators build custom on-chain achievements from live blockchain data with a no-code,
  template-based designer. The protocol is deployed on Ethereum mainnet (badge, badgeMinter and
  feeCollector smart contracts) and is powered by Alchemy Web3 infrastructure. Noox is a portfolio
  company of Electric Capital in the crypto sector. Note: Noox exposes no public REST/HTTP developer
  API, OpenAPI, GraphQL/subgraph, or SDK; its developer surface is the on-chain smart contracts.'
